# XcodeGen spec: generates Masroufi.xcodeproj (the GitHub workflow runs `xcodegen generate`).
name: Masroufi
options:
  bundleIdPrefix: com.masroufi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Masroufi:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: مصروفي
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        AppGroupID: group.com.masroufi.app
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Masroufi.entitlements
      properties:
        com.apple.security.application-groups: [group.com.masroufi.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masroufi.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MasroufiWidget
  MasroufiWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: مصروفي
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: group.com.masroufi.app
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/MasroufiWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.masroufi.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masroufi.app.widget
schemes:
  Masroufi:
    build:
      targets:
        Masroufi: all
        MasroufiWidget: all
