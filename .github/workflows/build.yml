# Builds مصروفي on GitHub's free macOS machines (no Mac needed) and produces Masroufi.ipa.
# Works with the project files committed directly, or with Masroufi.zip uploaded to the repository root.
name: Build Masroufi
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Masroufi.zip if it was uploaded
        run: |
          if [ -f Masroufi.zip ] && [ ! -f project.yml ]; then
            unzip -q Masroufi.zip -d _src
            SRC=$(dirname "$(find _src -maxdepth 3 -name project.yml | head -1)")
            cp -R "$SRC"/. .
          fi
          test -f project.yml
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Masroufi.xcodeproj -scheme Masroufi -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -n 200
      - name: Package Masroufi.ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/Masroufi.app
          # Ad-hoc signature that carries the App Group entitlement; the sideloading tool re-signs with your Apple ID.
          codesign --force --sign - --entitlements Widget/MasroufiWidget.entitlements "$APP/PlugIns/MasroufiWidget.appex"
          codesign --force --sign - --entitlements App/Masroufi.entitlements "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/ && zip -qry Masroufi.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Masroufi-ipa
          path: Masroufi.ipa
